name: Question
description: Ask about a passage, a lab, a sample response, or how the book is built.
title: "[Question] "
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ask here when a passage is unclear and you are not sure whether it is wrong. The answer may turn into a correction or a suggestion.
        Issues on this repo are public. Never name a student or paste student work.
  - type: dropdown
    id: chapter
    attributes:
      label: Where in the book
      options:
        - "Home page"
        - "The Fluency Contract"
        - "Chapter 1: What Artificial Intelligence Is"
        - "Chapter 2: How Generative AI Works and Where It Fails"
        - "Chapter 3: Research, Creative Work, and Responsible Use"
        - "Chapter 4: Prompt Basics and Prompt Types"
        - "Chapter 5: Strategies That Make Prompts Work"
        - "Chapter 6: Iterative Refinement"
        - "Chapter 7: Accuracy and Bias"
        - "Chapter 8: Governance, Privacy, and Content Ownership"
        - "Chapter 9: AI in Business and Society"
        - "Chapter 10: Surveying and Comparing AI Platforms"
        - "Chapter 11: Matching AI Tools to Scenarios"
        - "Chapter 12: The AI Application Project"
        - "Glossary"
        - "Skills Lab Rubric"
        - "Course data pack (assets/code)"
        - "How the book is built (repo, tools, workflow)"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Section or line
      description: The heading, the exercise number, or the page link.
      placeholder: 'Skills Lab 7A, Part 2, or a page link'
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This ticket names no student and includes no student work. Issues here are public.
          required: true
