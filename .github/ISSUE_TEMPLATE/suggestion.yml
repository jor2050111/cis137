name: Suggestion
description: A way to make a passage, lab, example, or figure clearer or stronger.
title: "[Suggestion] "
labels: ["suggestion", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Nothing here is wrong, it could just be better. Say what you would change and why a student is better off for it.
        Issues on this repo are public. Never name a student or paste student work.
  - type: dropdown
    id: chapter
    attributes:
      label: Where in the book
      options:
        - "Home page"
        - "The Fluency Contract"
        - "Chapter 1: What Artificial Intelligence Is"
        - "Chapter 2: How Generative AI Works and Where It Fails"
        - "Chapter 3: Research, Creative Work, and Responsible Use"
        - "Chapter 4: Prompt Basics and Prompt Types"
        - "Chapter 5: Strategies That Make Prompts Work"
        - "Chapter 6: Iterative Refinement"
        - "Chapter 7: Accuracy and Bias"
        - "Chapter 8: Governance, Privacy, and Content Ownership"
        - "Chapter 9: AI in Business and Society"
        - "Chapter 10: Surveying and Comparing AI Platforms"
        - "Chapter 11: Matching AI Tools to Scenarios"
        - "Chapter 12: The AI Application Project"
        - "Glossary"
        - "Skills Lab Rubric"
        - "Course data pack (assets/code)"
        - "The whole book (structure, order, a missing topic)"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Section or line
      description: The heading, the exercise number, or the page link. Leave it blank for a book-wide idea.
      placeholder: 'Try It Yourself 5.3, or the heading "Few-Shot Prompts", or a page link'
  - type: textarea
    id: change
    attributes:
      label: What to change
      description: The passage as you would rewrite it, or the lab step, example, or figure you would add or drop.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps students
      description: What a student can do after the change that they could not do before, or what confusion it removes.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Anything that backs the idea. A doc, a standard, a run you did yourself, or what you saw in your own class (no names).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This ticket names no student and includes no student work. Issues here are public.
          required: true
